<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Portfolio Tracker</title>
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1f2d45;
    --text: #e2e8f0;
    --muted: #64748b;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #38bdf8;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px 10px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 1.15rem; font-weight: 800; color: var(--blue); letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .refresh-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .status-bar { margin-top: 6px; font-size: 0.7rem; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.live { background: var(--green); }
  .dot.error { background: var(--red); }
  .summary {
    display: flex; gap: 10px; overflow-x: auto; padding: 14px 16px 6px;
    scrollbar-width: none;
  }
  .summary::-webkit-scrollbar { display: none; }
  .s-card {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 16px; min-width: 80px; text-align: center;
  }
  .s-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .s-val { font-size: 1.2rem; font-weight: 800; margin-top: 3px; }
  .tabs {
    display: flex; gap: 7px; padding: 10px 16px 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 13px; font-size: 0.76rem; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .loading-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999;
  }
  .spinner {
    width: 48px; height: 48px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 18px;
  }
  .loading-msg { color: var(--muted); font-size: 0.9rem; text-align: center; max-width: 280px; line-height: 1.5; }
  .cards { padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; cursor: pointer;
    transition: transform 0.12s; -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(0.985); }
  .card.buy  { border-left: 3px solid var(--green); }
  .card.hold { border-left: 3px solid var(--yellow); }
  .card.sell { border-left: 3px solid var(--red); }
  .card-top { padding: 14px 16px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-ticker { font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 0.6px; }
  .card-name { font-size: 0.98rem; font-weight: 700; color: var(--text); margin-top: 1px; line-height: 1.2; }
  .card-sector { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
  .badge {
    display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; margin-top: 8px;
  }
  .badge.buy  { background: rgba(34,197,94,0.14); color: var(--green); }
  .badge.hold { background: rgba(245,158,11,0.14); color: var(--yellow); }
  .badge.sell { background: rgba(239,68,68,0.14); color: var(--red); }
  .card-right { text-align: right; flex-shrink: 0; }
  .card-price { font-size: 1.08rem; font-weight: 800; }
  .card-day { font-size: 0.84rem; font-weight: 600; margin-top: 3px; }
  .metrics { display: flex; border-top: 1px solid var(--border); padding: 9px 16px; }
  .metric { flex: 1; text-align: center; }
  .metric:not(:last-child) { border-right: 1px solid var(--border); }
  .m-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .m-val { font-size: 0.88rem; font-weight: 600; margin-top: 2px; }
  .detail { display: none; border-top: 1px solid var(--border); padding: 16px; background: var(--surface2); }
  .detail.open { display: block; }
  .d-section { margin-bottom: 16px; }
  .d-section:last-child { margin-bottom: 0; }
  .d-title { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 9px; }
  .signals { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .signals li { font-size: 0.81rem; color: #94a3b8; padding-left: 14px; position: relative; line-height: 1.4; }
  .signals li::before { content: "•"; position: absolute; left: 0; color: var(--accent); }
  .commentary { font-size: 0.84rem; line-height: 1.65; color: #94a3b8; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .stat-box .sk { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat-box .sv { font-size: 0.9rem; font-weight: 600; margin-top: 2px; }
  .chevron { transition: transform 0.2s; display: inline-block; font-size: 0.65rem; margin-left: 4px; color: var(--muted); }
  .card.open .chevron { transform: rotate(180deg); }
  .g { color: var(--green); } .r { color: var(--red); } .y { color: var(--yellow); }
  .error-banner {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px; padding: 14px 16px; margin: 14px 12px;
    font-size: 0.84rem; color: #fca5a5; line-height: 1.5;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (min-width: 640px) {
    .cards { max-width: 700px; margin: 0 auto; }
    .summary { justify-content: center; }
  }
</style>
</head>
<body>

<div id="overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-msg">Loading portfolio data&#8230;</div>
</div>

<header>
  <div class="header-row">
    <div class="logo">Portfolio<span>Tracker</span></div>
    <button class="refresh-btn" onclick="location.reload()">&#8635; Refresh</button>
  </div>
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-txt">Loading&#8230;</span>
  </div>
</header>

<div class="summary" id="summary"></div>

<div class="tabs">
  <div class="tab active" onclick="setFilter('all',this)">All</div>
  <div class="tab" onclick="setFilter('buy',this)">&#128994; Buy</div>
  <div class="tab" onclick="setFilter('hold',this)">&#128993; Hold</div>
  <div class="tab" onclick="setFilter('sell',this)">&#128308; Sell</div>
  <div class="tab" onclick="setFilter('equity',this)">Equities</div>
  <div class="tab" onclick="setFilter('etf',this)">ETFs / ETC</div>
</div>

<div class="cards" id="cards"></div>

<script>
let allData = [], filter = 'all';
const pc  = v => v == null ? '&#8212;' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const pcC = v => v == null ? '' : v > 0 ? 'g' : v < 0 ? 'r' : '';
const fmt = (v, d=2) => v == null ? '&#8212;' : v.toFixed(d);

function renderSummary() {
  const buys  = allData.filter(d => d.recommendation === 'BUY').length;
  const holds = allData.filter(d => d.recommendation === 'HOLD').length;
  const sells = allData.filter(d => d.recommendation === 'SELL').length;
  const up    = allData.filter(d => d.day_change_pct > 0).length;
  document.getElementById('summary').innerHTML =
    `<div class="s-card"><div class="s-label">Holdings</div><div class="s-val">${allData.length}</div></div>` +
    `<div class="s-card"><div class="s-label">Buy</div><div class="s-val g">${buys}</div></div>` +
    `<div class="s-card"><div class="s-label">Hold</div><div class="s-val y">${holds}</div></div>` +
    `<div class="s-card"><div class="s-label">Sell</div><div class="s-val r">${sells}</div></div>` +
    `<div class="s-card"><div class="s-label">Up today</div><div class="s-val g">${up}</div></div>`;
}

function renderCards() {
  const f = allData.filter(d => {
    if (filter==='all')    return true;
    if (filter==='buy')    return d.recommendation==='BUY';
    if (filter==='hold')   return d.recommendation==='HOLD';
    if (filter==='sell')   return d.recommendation==='SELL';
    if (filter==='equity') return d.type==='equity';
    if (filter==='etf')    return d.type==='etf'||d.type==='etc';
  });
  const el = document.getElementById('cards');
  if (!f.length) { el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">No holdings match this filter.</div>'; return; }
  el.innerHTML = f.map((d,i) => {
    const rec = d.recommendation.toLowerCase();
    const sigs = (d.reasons||[]).map(r=>`<li>${r}</li>`).join('');
    return `<div class="card ${rec}" id="c${i}" onclick="toggle(${i})">
      <div class="card-top">
        <div>
          <div class="card-ticker">${d.ticker} <span class="chevron">&#9660;</span></div>
          <div class="card-name">${d.name}</div>
          <div class="card-sector">${d.sector} &middot; ${d.type.toUpperCase()}</div>
          <div class="badge ${rec}">${d.recommendation}</div>
        </div>
        <div class="card-right">
          <div class="card-price">${d.price!=null?(d.price<100?d.price.toFixed(2):d.price.toFixed(1)):'&#8212;'}</div>
          <div class="card-day ${pcC(d.day_change_pct)}">${pc(d.day_change_pct)}</div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="m-label">Week</div><div class="m-val ${pcC(d.week_change_pct)}">${pc(d.week_change_pct)}</div></div>
        <div class="metric"><div class="m-label">Month</div><div class="m-val ${pcC(d.month_change_pct)}">${pc(d.month_change_pct)}</div></div>
        <div class="metric"><div class="m-label">vs 52W High</div><div class="m-val ${pcC(d.pct_from_52w_high!=null?d.pct_from_52w_high*100:null)}">${pc(d.pct_from_52w_high!=null?d.pct_from_52w_high*100:null)}</div></div>
        <div class="metric"><div class="m-label">RSI</div><div class="m-val">${d.rsi!=null?d.rsi.toFixed(0):'&#8212;'}</div></div>
      </div>
      <div class="detail" id="d${i}">
        <div class="d-section"><div class="d-title">Technical Signals</div><ul class="signals">${sigs}</ul></div>
        <div class="d-section"><div class="d-title">Key Levels</div>
          <div class="stat-grid">
            <div class="stat-box"><div class="sk">SMA 50</div><div class="sv">${fmt(d.sma_50)}</div></div>
            <div class="stat-box"><div class="sk">SMA 200</div><div class="sv">${fmt(d.sma_200)}</div></div>
            <div class="stat-box"><div class="sk">52W High</div><div class="sv">${fmt(d.high_52w)}</div></div>
            <div class="stat-box"><div class="sk">52W Low</div><div class="sv">${fmt(d.low_52w)}</div></div>
          </div>
        </div>
        <div class="d-section"><div class="d-title">Fund Manager View</div><div class="commentary">${d.commentary}</div></div>
      </div>
    </div>`;
  }).join('');
}

function toggle(i) {
  document.getElementById('c'+i).classList.toggle('open');
  document.getElementById('d'+i).classList.toggle('open');
}
function setFilter(f,el) {
  filter=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

async function load() {
  try {
    const res = await fetch('data.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    allData = payload.holdings || [];
    document.getElementById('overlay').style.display = 'none';
    if (!allData.length) throw new Error('No holdings in data');
    renderSummary();
    renderCards();
    const d = new Date(payload.generated);
    document.getElementById('dot').className = 'dot live';
    document.getElementById('status-txt').textContent =
      'Data from ' + d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'}) +
      ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' UTC';
  } catch(e) {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('cards').innerHTML =
      '<div class="error-banner">&#9888;&#65039; Could not load data.json &#8212; ' + e.message +
      '<br><br>The data file is generated daily by GitHub Actions. If this is the first load, it may not exist yet. Check back in a few minutes after the Actions workflow completes.</div>';
    document.getElementById('dot').className = 'dot error';
    document.getElementById('status-txt').textContent = 'Data unavailable';
  }
}

load();
</script>
</body>
</html>
