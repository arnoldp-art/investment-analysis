<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Portfolio Tracker</title>
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1f2d45;
    --text: #e2e8f0;
    --muted: #64748b;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #38bdf8;
    --accent: #6366f1;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 64px;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px 10px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .logo { font-size: 1.15rem; font-weight: 800; color: var(--blue); letter-spacing: -0.5px; flex: 1; }
  .logo span { color: var(--accent); }
  .header-btns { display: flex; gap: 8px; align-items: center; }
  .refresh-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .export-btn {
    display: none; background: rgba(34,197,94,0.15); color: var(--green);
    border: 1px solid rgba(34,197,94,0.3); border-radius: 8px;
    padding: 7px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .export-btn.visible { display: flex; align-items: center; gap: 5px; }
  .portfolio-btn {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; gap: 5px;
    transition: all 0.2s;
  }
  .portfolio-btn.authed { background: rgba(245,158,11,0.15); color: var(--gold); border-color: rgba(245,158,11,0.4); }
  .status-bar { margin-top: 6px; font-size: 0.7rem; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.live { background: var(--green); }
  .dot.error { background: var(--red); }

  /* ── Macro bar ── */
  .macro-bar {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 4px;
    scrollbar-width: none; border-bottom: 1px solid var(--border);
    background: rgba(15,23,42,0.6);
  }
  .macro-bar::-webkit-scrollbar { display: none; }
  .macro-item {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; min-width: 64px;
  }
  .macro-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .macro-val   { font-size: 0.82rem; font-weight: 700; margin-top: 1px; }
  .macro-chg   { font-size: 0.68rem; font-weight: 600; }

  /* ── Portfolio summary bar ── */
  .portfolio-summary {
    display: none; gap: 0; border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(245,158,11,0.05) 0%, rgba(99,102,241,0.05) 100%);
  }
  .portfolio-summary.visible { display: flex; overflow-x: auto; padding: 12px 14px; gap: 10px; scrollbar-width: none; }
  .portfolio-summary::-webkit-scrollbar { display: none; }
  .ps-card {
    flex-shrink: 0; background: var(--surface); border: 1px solid rgba(245,158,11,0.25);
    border-radius: 12px; padding: 10px 16px; min-width: 90px; text-align: center;
  }
  .ps-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .ps-val   { font-size: 1.05rem; font-weight: 800; margin-top: 3px; }
  .ps-sub   { font-size: 0.68rem; margin-top: 2px; }

  /* ── Portfolio charts section ── */
  .portfolio-charts {
    display: none; padding: 14px 14px 8px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,23,42,0.4);
    gap: 14px; flex-wrap: wrap;
  }
  .portfolio-charts.visible { display: flex; }
  .chart-panel {
    flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .chart-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 8px; }
  .chart-sub { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  .donut-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 5px; }
  .dl-item { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; color: var(--muted); }
  .dl-dot  { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

  /* ── Alert banners ── */
  .alerts-container { padding: 0 12px; }
  .alert-banner {
    display: flex; align-items: center; gap: 10px;
    border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
    font-size: 0.82rem; font-weight: 600;
  }
  .alert-banner.above { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
  .alert-banner.below { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }

  /* ── Summary strip ── */
  .summary {
    display: flex; gap: 10px; overflow-x: auto; padding: 12px 14px 6px;
    scrollbar-width: none;
  }
  .summary::-webkit-scrollbar { display: none; }
  .s-card {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 16px; min-width: 80px; text-align: center;
  }
  .s-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .s-val   { font-size: 1.2rem; font-weight: 800; margin-top: 3px; }

  /* ── Filter tabs ── */
  .tabs {
    display: flex; gap: 7px; padding: 8px 14px 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 13px; font-size: 0.76rem; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999;
  }
  .spinner {
    width: 48px; height: 48px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 18px;
  }
  .loading-msg { color: var(--muted); font-size: 0.9rem; text-align: center; max-width: 280px; line-height: 1.5; }

  /* ── Login modal ── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 28px 24px; width: 320px; max-width: 90vw;
  }
  .modal-title { font-size: 1.05rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .modal-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .modal label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
  .modal input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 0.9rem;
    outline: none; margin-bottom: 14px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
  .modal-ok {
    flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
  }
  .modal-cancel {
    background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 0.88rem; cursor: pointer;
  }
  .modal-error { font-size: 0.78rem; color: var(--red); margin-top: 8px; min-height: 18px; }
  .modal-spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
    display: none; margin: 0 auto;
  }

  /* ── Cards ── */
  .cards { padding: 12px 12px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; cursor: pointer;
    transition: transform 0.12s; -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(0.985); }
  .card.buy  { border-left: 3px solid var(--green); }
  .card.hold { border-left: 3px solid var(--yellow); }
  .card.sell { border-left: 3px solid var(--red); }

  .card-top { padding: 14px 16px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-ticker { font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 0.6px; }
  .card-name { font-size: 0.98rem; font-weight: 700; color: var(--text); margin-top: 1px; line-height: 1.2; }
  .card-sector { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
  .badge {
    display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; margin-top: 8px;
  }
  .badge.buy  { background: rgba(34,197,94,0.14); color: var(--green); }
  .badge.hold { background: rgba(245,158,11,0.14); color: var(--yellow); }
  .badge.sell { background: rgba(239,68,68,0.14); color: var(--red); }

  .delta-chip {
    display: inline-flex; align-items: center; font-size: 0.62rem; font-weight: 700;
    border-radius: 20px; padding: 2px 8px; margin-left: 6px; vertical-align: middle;
  }
  .delta-up   { background: rgba(34,197,94,0.15);  color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
  .delta-down { background: rgba(239,68,68,0.15);  color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }

  .verified-chip {
    display: inline-flex; align-items: center; font-size: 0.62rem; color: #34d399;
    background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.25);
    border-radius: 20px; padding: 2px 7px; margin-left: 6px; vertical-align: middle;
  }
  .earnings-chip {
    display: inline-flex; align-items: center; font-size: 0.62rem; color: var(--yellow);
    background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3);
    border-radius: 20px; padding: 2px 7px; margin-left: 6px; vertical-align: middle;
  }
  .alert-chip {
    display: inline-flex; align-items: center; font-size: 0.62rem; font-weight: 700;
    border-radius: 20px; padding: 2px 8px; margin-left: 6px; vertical-align: middle;
  }
  .alert-chip.above { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
  .alert-chip.below { background: rgba(239,68,68,0.15); color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }

  .card-right { text-align: right; flex-shrink: 0; }
  .card-price { font-size: 1.08rem; font-weight: 800; }
  .card-day   { font-size: 0.84rem; font-weight: 600; margin-top: 3px; }

  /* ── Position strip ── */
  .position-strip {
    display: none; border-top: 1px solid rgba(245,158,11,0.2);
    background: rgba(245,158,11,0.04); padding: 8px 16px;
    flex-wrap: wrap; gap: 14px;
  }
  .position-strip.visible { display: flex; }
  .pos-item { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
  .pos-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .pos-val   { font-size: 0.88rem; font-weight: 700; margin-top: 2px; }
  .pos-no-position { font-size: 0.75rem; color: var(--muted); font-style: italic; padding: 4px 0; }

  /* ── Metrics row ── */
  .metrics { display: flex; border-top: 1px solid var(--border); padding: 9px 16px; }
  .metric { flex: 1; text-align: center; }
  .metric:not(:last-child) { border-right: 1px solid var(--border); }
  .m-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .m-val   { font-size: 0.88rem; font-weight: 600; margin-top: 2px; }

  /* ── Detail panel ── */
  .detail { display: none; border-top: 1px solid var(--border); padding: 16px; background: var(--surface2); }
  .detail.open { display: block; }
  .d-section { margin-bottom: 16px; }
  .d-section:last-child { margin-bottom: 0; }
  .d-title {
    font-size: 0.66rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--muted); margin-bottom: 9px;
  }
  .signals { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .signals li { font-size: 0.81rem; color: #94a3b8; padding-left: 14px; position: relative; line-height: 1.4; }
  .signals li::before { content: "\2022"; position: absolute; left: 0; color: var(--accent); }
  .commentary { font-size: 0.84rem; line-height: 1.65; color: #94a3b8; }

  /* ── Tooltips ── */
  .tip {
    cursor: help;
    border-bottom: 1px dotted var(--muted);
    position: relative;
    display: inline;
  }
  .tip::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #e2e8f0;
    padding: 7px 11px;
    border-radius: 9px;
    font-size: 0.71rem;
    font-weight: 400;
    width: 210px;
    white-space: normal;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 9999;
    border: 1px solid var(--border);
    line-height: 1.45;
    text-transform: none;
    letter-spacing: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .tip:hover::after, .tip.show::after { opacity: 1; }
  /* keep tooltip on screen for left-edge labels */
  .tip.tip-right::after { left: 0; transform: none; }
  .tip.tip-left::after  { left: auto; right: 0; transform: none; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .stat-box .sk { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat-box .sv { font-size: 0.9rem; font-weight: 600; margin-top: 2px; }

  .analyst-target { font-size: 0.88rem; color: var(--text); margin-bottom: 9px; }
  .analyst-target span { font-weight: 700; }
  .analyst-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 1px; margin: 7px 0 4px; }
  .ab-seg { height: 100%; }
  .ab-strong-buy  { background: #16a34a; }
  .ab-buy         { background: #22c55e; }
  .ab-hold        { background: #f59e0b; }
  .ab-sell        { background: #ef4444; }
  .ab-strong-sell { background: #b91c1c; }
  .analyst-legend { display: flex; gap: 10px; flex-wrap: wrap; }
  .al-item { font-size: 0.66rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .al-dot  { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .rec-key {
    display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.72rem;
    font-weight: 700; text-transform: capitalize; margin-bottom: 8px;
  }
  .rec-key.buy, .rec-key.strongbuy  { background: rgba(34,197,94,0.15); color: var(--green); }
  .rec-key.hold                      { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .rec-key.sell, .rec-key.strongsell { background: rgba(239,68,68,0.15); color: var(--red); }

  .news-list { display: flex; flex-direction: column; gap: 8px; }
  .news-item { border-left: 2px solid var(--border); padding-left: 10px; }
  .news-title { font-size: 0.82rem; color: var(--text); line-height: 1.35; }
  .news-title a { color: inherit; text-decoration: none; }
  .news-title a:hover { color: var(--blue); }
  .news-meta { font-size: 0.66rem; color: var(--muted); margin-top: 3px; }

  /* ── Rebalancing ── */
  .rebal-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .rebal-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); }
  .rebal-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; position: relative; }
  .rebal-current { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .rebal-target-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); border-radius: 1px; }
  .rebal-suggestion { font-size: 0.75rem; margin-top: 2px; }

  /* ── Transaction history ── */
  .tx-list { display: flex; flex-direction: column; gap: 5px; }
  .tx-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.76rem; padding: 6px 10px; border-radius: 7px; background: var(--surface);
    border: 1px solid var(--border);
  }
  .tx-type { font-weight: 700; padding: 1px 7px; border-radius: 10px; font-size: 0.65rem; }
  .tx-type.buy  { background: rgba(34,197,94,0.15); color: var(--green); }
  .tx-type.sell { background: rgba(239,68,68,0.15); color: var(--red); }
  .tx-date { color: var(--muted); font-size: 0.68rem; }

  .chevron { transition: transform 0.2s; display: inline-block; font-size: 0.65rem; margin-left: 4px; color: var(--muted); }
  .card.open .chevron { transform: rotate(180deg); }

  .g { color: var(--green); } .r { color: var(--red); } .y { color: var(--yellow); }

  .error-banner {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px; padding: 14px 16px; margin: 14px 12px;
    font-size: 0.84rem; color: #fca5a5; line-height: 1.5;
  }
  .sources-footer {
    margin: 18px 14px 0; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    font-size: 0.68rem; color: var(--muted); line-height: 1.7;
  }
  .sources-footer strong { color: #94a3b8; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (min-width: 640px) {
    .cards { max-width: 700px; margin: 0 auto; }
    .summary { justify-content: center; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div id="overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-msg">Loading portfolio data&hellip;</div>
</div>

<!-- Login modal -->
<div class="modal-backdrop" id="modal-backdrop" onclick="handleBackdropClick(event)">
  <div class="modal">
    <div class="modal-title">&#128274; My Portfolio</div>
    <div class="modal-sub">Enter your portfolio password to overlay your actual positions on the market data.</div>
    <label for="pwd-input">Password</label>
    <input type="password" id="pwd-input" placeholder="Password" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-ok" id="login-btn" onclick="doLogin()">Unlock</button>
    </div>
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-spinner" id="modal-spinner"></div>
  </div>
</div>

<header>
  <div class="header-row">
    <div class="logo">Portfolio<span>Tracker</span></div>
    <div class="header-btns">
      <button class="export-btn" id="export-btn" onclick="exportCSV()">&#8615; CSV</button>
      <button class="portfolio-btn" id="portfolio-btn" onclick="handlePortfolioBtn()">
        <span id="portfolio-btn-icon">&#128274;</span>
        <span id="portfolio-btn-label">My Portfolio</span>
      </button>
      <button class="refresh-btn" onclick="location.reload()">&#8635;</button>
    </div>
  </div>
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-txt">Loading&hellip;</span>
  </div>
</header>

<div class="macro-bar" id="macro-bar"></div>
<div class="portfolio-summary" id="portfolio-summary"></div>
<div class="portfolio-charts" id="portfolio-charts"></div>
<div class="alerts-container" id="alerts-container"></div>
<div class="summary" id="summary"></div>

<div class="tabs">
  <div class="tab active" onclick="setFilter('all',this)">All</div>

<script>
// ── Tooltip helper ────────────────────────────────────────────────────────────
const TIPS = {
  vix:         "VIX — Volatility Index. Measures expected market turbulence over 30 days. Above 30 = high fear; below 20 = calm markets.",
  sp500:       "S&P 500 — Index of the 500 largest US companies. The main US market benchmark.",
  ftse100:     "FTSE 100 — Index of the 100 largest companies on the London Stock Exchange. Main UK market benchmark.",
  gold:        "Gold futures price (USD/oz). Often rises when investors seek safety from market uncertainty.",
  treasury10y: "US 10-Year Treasury yield — interest rate on US government bonds. Rising yields often pressure growth stock valuations.",
  gbpusd:      "GBP/USD exchange rate — pounds to dollars. Affects the GBP value of US-listed holdings.",
  rsi:         "RSI (Relative Strength Index, 0–100) — momentum indicator. Below 30 = oversold, may bounce. Above 70 = overbought, may pull back. 40–60 = neutral.",
  '52whigh':   "52-Week High — how far the current price sits below the highest price of the past year. At 0% means near the top.",
  sma50:       "SMA 50 — Simple Moving Average over 50 trading days. Average closing price for the past ~10 weeks. Used to gauge medium-term trend direction.",
  sma200:      "SMA 200 — Simple Moving Average over 200 trading days (~10 months). The most-watched long-term trend indicator on Wall Street.",

  deathcross:  "Death Cross — when the 50-day average crosses below the 200-day average. Widely watched bearish signal.",

  atr:         "ATR (Average True Range) — average daily price swing over 14 days. Shows how volatile a stock is. Higher % = bigger daily moves.",
  beta:        "Beta — how much this stock moves relative to the overall market. Beta 1.5 = moves 50% more than the market. Beta 0.5 = half as much. Negative = moves opposite.",
  fwdpe:       "Forward P/E — share price divided by expected earnings per share for the next 12 months. Lower can mean cheaper relative to future profits, but high-growth stocks often have high P/E.",
  trailingpe:  "Trailing P/E — share price divided by actual earnings per share over the past 12 months. Based on real, not forecast, numbers.",
  pb:          "Price-to-Book — share price divided by the company's net assets per share. Below 1 can signal undervaluation; above 3 is common for profitable tech companies.",
  divyield:    "Dividend Yield — annual dividend as a % of the current share price. E.g. 3% yield on a £10 share = 30p per share per year.",
  revgrowth:   "Revenue Growth — year-on-year change in the company's total sales.",
  epsgrowth:   "EPS Growth (Earnings Per Share) — year-on-year change in profit per share. Positive and accelerating is a strong quality signal.",
  roe:         "Return on Equity — annual profit as a % of shareholders' equity. Measures how efficiently management uses the money invested. Above 15% is generally considered strong.",
  de:          "Debt-to-Equity ratio — total debt divided by shareholders' equity. Higher = more borrowed money relative to own funds = more financial risk.",
  shortratio:  "Short Ratio (Days to Cover) — how many days of average trading volume short sellers would need to buy back all their shares. Higher = more bearish bets outstanding.",
  stooq:       "Stooq.com — independent financial data site used to cross-check the Yahoo Finance price. A tick means the two sources agree within 2%.",
  yoc:         "Yield on Cost — your personal dividend yield based on what you originally paid, not today's price. If you bought years ago at a lower price, this is higher than the current yield.",
  exdiv:       "Ex-Dividend Date — you must own the stock before this date to receive the next dividend. If you buy on or after this date, the seller keeps the dividend.",
  avco:        "AVCO (Average Cost) — your average purchase price per share calculated across all buy transactions, adjusted when you sell. This is what HMRC uses for UK capital gains calculation.",
  rebalancing: "Rebalancing — adjusting how much of each holding you own so it matches your target allocation. Keeps your risk in line with your original plan.",
  analystcons: "Analyst Consensus — the combined opinion of professional equity analysts who research this stock. Based on their buy/hold/sell ratings and price targets.",
  blended:     "This signal is a blend: 40% technical indicators + 60% analyst consensus, so short-term chart noise is balanced by longer-term professional research.",
};

function tip(label, key, cls) {
  const text = TIPS[key];
  if (!text) return label;
  return `<span class="tip${cls?' '+cls:''}" data-tip="${text.replace(/"/g,'&quot;')}">${label}</span>`;
}

// Mobile tap to show tooltip
document.addEventListener('click', e => {
  const t = e.target.closest('.tip');
  document.querySelectorAll('.tip.show').forEach(el => { if (el !== t) el.classList.remove('show'); });
  if (t) { t.classList.toggle('show'); e.stopPropagation(); }
});

// ── State ────────────────────────────────────────────────────────────────────
let allData = [], filter = 'all', macroData = {};
let positionsMap = {};   // {ticker: {shares, avg_cost, alert_above, alert_below, target_weight_pct, transactions}}
let watchlistTickers = [];
let isPortfolioMode = false;

// ── Helpers ──────────────────────────────────────────────────────────────────
const pc  = v => v == null ? '&mdash;' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const pcC = v => v == null ? '' : v > 0 ? 'g' : v < 0 ? 'r' : '';
const fmt = (v, d=2) => v == null ? '&mdash;' : Number(v).toFixed(d);
const pct = v => v == null ? '&mdash;' : (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
const REC_RANK = { 'SELL': 0, 'HOLD': 1, 'BUY': 2 };

function fmtMoney(v, decimals=2) {
  if (v == null) return '&mdash;';
  const abs = Math.abs(v);
  const s = abs >= 1e6 ? (abs/1e6).toFixed(2)+'M'
           : abs >= 1e3 ? (abs/1e3).toFixed(1)+'k'
           : abs.toFixed(decimals);
  return (v < 0 ? '-' : '') + s;
}

function fmtGBP(v) {
  if (v == null) return '&mdash;';
  return '&pound;' + fmtMoney(v);
}

function deltaChip(current, previous) {
  if (!previous || previous === current) return '';
  const up = REC_RANK[current] > REC_RANK[previous];
  return `<span class="delta-chip ${up?'delta-up':'delta-down'}">${up?'&#8593;':'&#8595;'} was ${previous}</span>`;
}

// GBP/USD from macro — UK .L stocks trade in pence (GBX) so divide by 100; USD divide by GBPUSD
function getGBPRate() {
  return macroData?.gbpusd?.value || null;
}

function toGBP(ticker, nativeValue) {
  if (nativeValue == null) return null;
  if (ticker.endsWith('.L')) return nativeValue / 100;
  const rate = getGBPRate();
  return rate ? nativeValue / rate : null;
}

// AVCO: compute average cost from transaction history
function computeAVCO(transactions) {
  if (!transactions || !transactions.length) return null;
  const sorted = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
  let totalShares = 0, totalCost = 0;
  for (const tx of sorted) {
    if (tx.type === 'buy') {
      totalShares += tx.shares;
      totalCost   += tx.shares * tx.price;
    } else if (tx.type === 'sell') {
      const avgCost = totalShares > 0 ? totalCost / totalShares : 0;
      totalShares  -= tx.shares;
      totalCost    -= tx.shares * avgCost;
    }
  }
  return { shares: Math.max(0, totalShares), avg_cost: totalShares > 0 ? totalCost / totalShares : 0 };
}

// Resolve position (transactions take precedence if non-empty)
function resolvePos(pos) {
  if (!pos) return null;
  if (pos.transactions && pos.transactions.length) {
    const avco = computeAVCO(pos.transactions);
    return { ...pos, shares: avco.shares, avg_cost: avco.avg_cost };
  }
  return pos;
}

// Days until a date string (YYYY-MM-DD)
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const diff = (new Date(dateStr) - new Date()) / 86400000;
  return Math.round(diff);
}

// ── Crypto helpers ────────────────────────────────────────────────────────────
const SALT_STR = "portfolio-tracker-v1-salt";
const ITERATIONS = 100000;

async function deriveKey(password) {
  const enc = new TextEncoder();
  const raw = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: enc.encode(SALT_STR), iterations: ITERATIONS, hash: "SHA-256" },
    raw, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

async function decryptPositions(password, enc) {
  const key = await deriveKey(password);
  const iv   = b64ToBytes(enc.iv);
  const data = b64ToBytes(enc.data);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

// ── Login ─────────────────────────────────────────────────────────────────────
function handlePortfolioBtn() {
  if (isPortfolioMode) {
    isPortfolioMode = false;
    positionsMap = {};
    watchlistTickers = [];
    sessionStorage.removeItem('ptpwd');
    document.getElementById('portfolio-btn').classList.remove('authed');
    document.getElementById('portfolio-btn-icon').textContent = '🔒';
    document.getElementById('portfolio-btn-label').textContent = 'My Portfolio';
    document.getElementById('portfolio-summary').classList.remove('visible');
    document.getElementById('portfolio-charts').classList.remove('visible');
    document.getElementById('alerts-container').innerHTML = '';
    document.getElementById('export-btn').classList.remove('visible');
    document.getElementById('watchlist-tab').style.display = 'none';
    if (filter === 'watchlist') { filter = 'all'; document.querySelectorAll('.tab').forEach((t,i)=>{ if(i===0) t.classList.add('active'); else t.classList.remove('active'); }); }
    renderCards();
  } else {
    openModal();
  }
}

function openModal() {
  document.getElementById('modal-backdrop').classList.add('open');
  document.getElementById('pwd-input').value = '';
  document.getElementById('modal-error').textContent = '';
  setTimeout(() => document.getElementById('pwd-input').focus(), 100);
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
function handleBackdropClick(e) { if (e.target === document.getElementById('modal-backdrop')) closeModal(); }

async function doLogin() {
  const pwd = document.getElementById('pwd-input').value.trim();
  if (!pwd) return;
  document.getElementById('login-btn').style.display = 'none';
  document.getElementById('modal-spinner').style.display = 'block';
  document.getElementById('modal-error').textContent = '';
  try {
    const res = await fetch('positions.enc?v=' + Date.now());
    if (!res.ok) throw new Error('positions.enc not found');
    const enc = await res.json();
    const data = await decryptPositions(pwd, enc);
    applyPortfolioData(data, pwd);
    closeModal();
  } catch(e) {
    document.getElementById('modal-error').textContent = 'Incorrect password — try again.';
  } finally {
    document.getElementById('login-btn').style.display = '';
    document.getElementById('modal-spinner').style.display = 'none';
  }
}

function applyPortfolioData(data, pwd) {
  positionsMap = {};
  (data.positions || []).forEach(p => { positionsMap[p.ticker] = p; });
  watchlistTickers = data.watchlist || [];
  isPortfolioMode = true;
  if (pwd) sessionStorage.setItem('ptpwd', pwd);

  document.getElementById('portfolio-btn').classList.add('authed');
  document.getElementById('portfolio-btn-icon').textContent = '✅';
  document.getElementById('portfolio-btn-label').textContent = 'Portfolio On';
  document.getElementById('export-btn').classList.add('visible');

  if (watchlistTickers.length) {
    document.getElementById('watchlist-tab').style.display = '';
  }

  renderPortfolioSummary();
  renderPortfolioCharts();
  renderAlerts();
  renderCards();
}

// ── Portfolio summary ─────────────────────────────────────────────────────────
function renderPortfolioSummary() {
  if (!isPortfolioMode) return;
  let totalCostGBP = 0, totalValueGBP = 0, positions = 0;

  allData.forEach(d => {
    const pos = resolvePos(positionsMap[d.ticker]);
    if (!pos || !pos.shares || !d.price) return;
    const vGBP = toGBP(d.ticker, pos.shares * d.price);
    const cGBP = toGBP(d.ticker, pos.shares * pos.avg_cost);
    if (vGBP == null) return;
    positions++;
    totalValueGBP += vGBP;
    if (cGBP != null) totalCostGBP += cGBP;
  });

  const pnl    = totalValueGBP - totalCostGBP;
  const pnlPct = totalCostGBP > 0 ? pnl / totalCostGBP * 100 : 0;
  const pnlCls = pnl >= 0 ? 'g' : 'r';
  const rateStr = getGBPRate() ? ` &middot; GBP/USD ${getGBPRate().toFixed(4)}` : '';

  const el = document.getElementById('portfolio-summary');
  el.innerHTML =
    psCard('Positions', positions, '') +
    psCard('Total Cost', fmtGBP(totalCostGBP), '') +
    psCard('Market Value', fmtGBP(totalValueGBP), '') +
    psCard('Unrealised P&amp;L',
      `<span class="${pnlCls}">${pnl >= 0 ? '+' : ''}${fmtGBP(pnl)}</span>`,
      `<span class="${pnlCls}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</span>`) +
    `<div class="ps-card" style="min-width:120px"><div class="ps-label">Base Currency</div><div class="ps-val" style="font-size:0.85rem">GBP${rateStr}</div></div>`;
  el.classList.add('visible');
}

function psCard(label, val, sub) {
  return `<div class="ps-card"><div class="ps-label">${label}</div><div class="ps-val">${val}</div>${sub ? `<div class="ps-sub">${sub}</div>` : ''}</div>`;
}

// ── Portfolio charts: performance line + sector donut ─────────────────────────
function renderPortfolioCharts() {
  if (!isPortfolioMode) return;
  const el = document.getElementById('portfolio-charts');

  const lineHTML  = buildPerformanceChart();
  const donutHTML = buildSectorDonut();
  const rebalHTML = buildRebalancingPanel();

  if (!lineHTML && !donutHTML && !rebalHTML) return;

  el.innerHTML =
    (lineHTML  ? `<div class="chart-panel" style="min-width:240px">${lineHTML}</div>`  : '') +
    (donutHTML ? `<div class="chart-panel">${donutHTML}</div>` : '') +
    (rebalHTML ? `<div class="chart-panel" style="min-width:260px">${rebalHTML}</div>` : '');
  el.classList.add('visible');
}

function buildPerformanceChart() {
  const dateMap = {};
  allData.forEach(d => {
    const pos = resolvePos(positionsMap[d.ticker]);
    if (!pos || !(pos.shares > 0)) return;
    (d.price_history || []).forEach(({d: date, c: price}) => {
      const v = toGBP(d.ticker, pos.shares * price);
      if (v == null) return;
      dateMap[date] = (dateMap[date] || 0) + v;
    });
  });
  const pts = Object.entries(dateMap).sort((a, b) => a[0].localeCompare(b[0]));
  if (pts.length < 2) return '';

  const values = pts.map(p => p[1]);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const range = maxV - minV || 1;
  const W = 260, H = 72;
  const svgPts = pts.map(([, v], i) => {
    const x = 2 + i / (pts.length - 1) * (W - 4);
    const y = H - 2 - (v - minV) / range * (H - 8);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = values[values.length - 1] >= values[0] ? '#22c55e' : '#ef4444';
  const chgPct = ((values[values.length-1] - values[0]) / values[0] * 100);
  const chgCls = chgPct >= 0 ? 'g' : 'r';

  return `<div class="chart-title">30-Day Portfolio Performance (GBP)</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
      <polyline points="${svgPts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="chart-sub">
      ${fmtGBP(values[values.length-1])} &nbsp;
      <span class="${chgCls}">${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)}% vs 30d ago</span>
    </div>`;
}

function buildSectorDonut() {
  const sectorMap = {};
  allData.forEach(d => {
    const pos = resolvePos(positionsMap[d.ticker]);
    if (!pos || !(pos.shares > 0) || !d.price) return;
    const v = toGBP(d.ticker, pos.shares * d.price);
    if (v == null || v <= 0) return;
    sectorMap[d.sector] = (sectorMap[d.sector] || 0) + v;
  });
  const entries = Object.entries(sectorMap).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  if (!total) return '';

  const colors = ['#6366f1','#22c55e','#f59e0b','#38bdf8','#ef4444','#a78bfa','#34d399','#fb923c'];
  const cx = 55, cy = 55, r = 44, ir = 26;
  let startAngle = -Math.PI / 2, paths = '';

  entries.forEach(([, val], i) => {
    const angle = (val / total) * 2 * Math.PI;
    const endAngle = startAngle + angle;
    const x1 = cx + r * Math.cos(startAngle),   y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle),     y2 = cy + r * Math.sin(endAngle);
    const xi1 = cx + ir * Math.cos(endAngle),  yi1 = cy + ir * Math.sin(endAngle);
    const xi2 = cx + ir * Math.cos(startAngle),yi2 = cy + ir * Math.sin(startAngle);
    const large = angle > Math.PI ? 1 : 0;
    paths += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${xi1.toFixed(1)},${yi1.toFixed(1)} A${ir},${ir} 0 ${large},0 ${xi2.toFixed(1)},${yi2.toFixed(1)} Z" fill="${colors[i % colors.length]}" opacity="0.85"/>`;
    startAngle = endAngle;
  });

  const legend = entries.map(([sec, val], i) =>
    `<div class="dl-item"><div class="dl-dot" style="background:${colors[i%colors.length]}"></div>${sec} ${(val/total*100).toFixed(1)}%</div>`
  ).join('');

  return `<div class="chart-title">Sector Exposure (GBP)</div>
    <div class="donut-wrap">
      <svg width="110" height="110" viewBox="0 0 110 110">${paths}</svg>
      <div class="donut-legend">${legend}</div>
    </div>`;
}

function buildRebalancingPanel() {
  const rows = [];
  let totalValue = 0;
  allData.forEach(d => {
    const pos = resolvePos(positionsMap[d.ticker]);
    if (!pos || !(pos.shares > 0) || !d.price) return;
    const v = toGBP(d.ticker, pos.shares * d.price);
    if (v != null) totalValue += v;
  });
  if (!totalValue) return '';

  allData.forEach(d => {
    const pos = resolvePos(positionsMap[d.ticker]);
    if (!pos || pos.target_weight_pct == null) return;
    const v = pos.shares > 0 && d.price ? (toGBP(d.ticker, pos.shares * d.price) || 0) : 0;
    const currentPct = (v / totalValue * 100);
    const targetPct  = pos.target_weight_pct;
    const diff = targetPct - currentPct;
    const diffGBP = diff / 100 * totalValue;
    const action = Math.abs(diff) < 0.5 ? '' : diff > 0
      ? `<span class="g">+${fmtGBP(diffGBP)} to buy</span>`
      : `<span class="r">${fmtGBP(diffGBP)} to sell</span>`;
    rows.push(`<div class="rebal-row">
      <div class="rebal-labels"><span>${d.ticker}</span><span>${currentPct.toFixed(1)}% / <span style="color:var(--accent)">${targetPct}% target</span></span></div>
      <div class="rebal-track">
        <div class="rebal-current" style="width:${Math.min(currentPct/Math.max(targetPct,currentPct)*100,100).toFixed(1)}%;background:${diff>0.5?'var(--yellow)':diff<-0.5?'var(--red)':'var(--green)'}"></div>
        <div class="rebal-target-line" style="left:${(targetPct/Math.max(targetPct,currentPct)*100).toFixed(1)}%"></div>
      </div>
      <div class="rebal-suggestion">${action}</div>
    </div>`);
  });

  if (!rows.length) return '';
  return `<div class="chart-title">Rebalancing</div>${rows.join('')}`;
}

// ── Price alerts ──────────────────────────────────────────────────────────────
function renderAlerts() {
  const el = document.getElementById('alerts-container');
  if (!isPortfolioMode) { el.innerHTML = ''; return; }
  const banners = [];
  allData.forEach(d => {
    const pos = positionsMap[d.ticker];
    if (!pos || !d.price) return;
    if (pos.alert_above != null && d.price >= pos.alert_above) {
      banners.push(`<div class="alert-banner above">&#9650; ${d.ticker} hit your target — above ${pos.alert_above} (now ${d.price < 100 ? d.price.toFixed(2) : d.price.toFixed(1)})</div>`);
    }
    if (pos.alert_below != null && d.price <= pos.alert_below) {
      banners.push(`<div class="alert-banner below">&#9660; ${d.ticker} alert — below ${pos.alert_below} (now ${d.price < 100 ? d.price.toFixed(2) : d.price.toFixed(1)})</div>`);
    }
  });
  el.innerHTML = banners.length ? `<div style="padding-top:10px">${banners.join('')}</div>` : '';
}

// ── Position strip (per card) ────────────────────────────────────────────────
function positionStrip(d) {
  if (!isPortfolioMode) return '<div class="position-strip"></div>';

  const rawPos = positionsMap[d.ticker];
  const pos = resolvePos(rawPos);
  if (!pos || !pos.shares) {
    return '<div class="position-strip visible"><span class="pos-no-position">No position held</span></div>';
  }

  const { shares, avg_cost } = pos;
  const price    = d.price;
  const value    = shares * price;
  const cost     = shares * avg_cost;
  const pnl      = value - cost;
  const pnlPct   = cost > 0 ? pnl / cost * 100 : 0;
  const pnlCls   = pnl >= 0 ? 'g' : 'r';
  const dayPnl   = shares * price * (d.day_change_pct || 0) / 100;
  const dayPnlCls = dayPnl >= 0 ? 'g' : 'r';

  const valueGBP = toGBP(d.ticker, value);
  const pnlGBP   = toGBP(d.ticker, pnl);

  let totalValueGBP = 0;
  allData.forEach(dd => {
    const pp = resolvePos(positionsMap[dd.ticker]);
    if (pp && pp.shares && dd.price) {
      const v = toGBP(dd.ticker, pp.shares * dd.price);
      if (v != null) totalValueGBP += v;
    }
  });
  const weight = totalValueGBP > 0 && valueGBP != null ? valueGBP / totalValueGBP * 100 : 0;

  const alertChip = (() => {
    if (!rawPos) return '';
    if (rawPos.alert_above != null && price >= rawPos.alert_above) return '<span class="alert-chip above">&#9650; Alert</span>';
    if (rawPos.alert_below != null && price <= rawPos.alert_below) return '<span class="alert-chip below">&#9660; Alert</span>';
    return '';
  })();

  return `<div class="position-strip visible">
    <div class="pos-item"><div class="pos-label">Shares</div><div class="pos-val">${shares.toLocaleString()}</div></div>
    <div class="pos-item"><div class="pos-label">Avg Cost</div><div class="pos-val">${avg_cost < 1000 ? avg_cost.toFixed(2) : avg_cost.toFixed(0)}</div></div>
    <div class="pos-item"><div class="pos-label">Value (GBP)</div><div class="pos-val">${fmtGBP(valueGBP)}</div></div>
    <div class="pos-item"><div class="pos-label">P&amp;L (GBP)</div><div class="pos-val ${pnlCls}">${pnlGBP != null ? (pnlGBP >= 0 ? '+' : '') + fmtGBP(pnlGBP) : '&mdash;'}</div></div>
    <div class="pos-item"><div class="pos-label">P&amp;L %</div><div class="pos-val ${pnlCls}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(1)}%</div></div>
    <div class="pos-item"><div class="pos-label">Today</div><div class="pos-val ${dayPnlCls}">${dayPnl >= 0 ? '+' : ''}${fmtGBP(toGBP(d.ticker, dayPnl))}</div></div>
    <div class="pos-item"><div class="pos-label">Weight</div><div class="pos-val">${weight.toFixed(1)}%</div></div>
    ${alertChip}
  </div>`;
}

// ── Render helpers ────────────────────────────────────────────────────────────
function renderMacro(macro) {
  if (!macro || !Object.keys(macro).length) return;
  macroData = macro;
  document.getElementById('macro-bar').innerHTML = Object.values(macro).map(m => {
    const chg = m.change_pct;
    const cls = chg == null ? '' : chg >= 0 ? 'g' : 'r';
    const chgStr = chg == null ? '' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
    const v = m.value;
    const valStr = v == null ? '&mdash;'
                 : v >= 1000 ? v.toLocaleString(undefined, {maximumFractionDigits:0})
                 : v >= 10   ? v.toFixed(2)
                 :              v.toFixed(4);
    const MACRO_KEYS = { 'VIX':'vix','S&P 500':'sp500','FTSE 100':'ftse100','Gold':'gold','US 10Y':'treasury10y','GBP/USD':'gbpusd' };
    const labelHTML = tip(m.label, MACRO_KEYS[m.label] || '');
    return `<div class="macro-item"><div class="macro-label">${labelHTML}</div><div class="macro-val">${valStr}</div>${chgStr?`<div class="macro-chg ${cls}">${chgStr}</div>`:''}</div>`;
  }).join('');
}

function renderSummary() {
  const buys    = allData.filter(d => d.recommendation === 'BUY').length;
  const holds   = allData.filter(d => d.recommendation === 'HOLD').length;
  const sells   = allData.filter(d => d.recommendation === 'SELL').length;
  const up      = allData.filter(d => d.day_change_pct > 0).length;
  const changed = allData.filter(d => d.previous_recommendation && d.previous_recommendation !== d.recommendation).length;
  document.getElementById('summary').innerHTML =
    sc('Holdings', allData.length, '') +
    sc('Buy',    buys,  'g') +
    sc('Hold',   holds, 'y') +
    sc('Sell',   sells, 'r') +
    sc('Up today', up, 'g') +
    (changed ? sc('Changed', changed, 'y') : '');
  function sc(l,v,c) { return `<div class="s-card"><div class="s-label">${l}</div><div class="s-val ${c}">${v}</div></div>`; }
}

function analystSection(d) {
  const { analyst_breakdown: bd, recommendation_key: rk, analyst_target_mean: mean,
          analyst_target_high: hi, analyst_target_low: lo, analyst_count: cnt, price } = d;
  if (!bd && !rk && !mean) return '';

  let h = `<div class="d-section"><div class="d-title">${tip('Analyst Consensus','analystcons')}${cnt?` &nbsp;<span style="font-weight:400;color:var(--muted)">(${cnt} analysts)</span>`:''}</div>`;
  if (rk) {
    const cls = rk.replace(/_/g,'');
    h += `<div class="rec-key ${cls}">${rk.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</div>`;
  }
  if (mean && price) {
    const u = (mean-price)/price*100, cls=u>=0?'g':'r', dir=u>=0?'upside':'downside';
    h += `<div class="analyst-target">Target: <span>${lo?fmt(lo):'?'} &ndash; <span class="${cls}">${fmt(mean)}</span> &ndash; ${hi?fmt(hi):'?'}</span> &nbsp;<span class="${cls}">(${u>=0?'+':''}${u.toFixed(1)}% ${dir})</span></div>`;
  }
  if (bd) {
    const t = bd.strong_buy+bd.buy+bd.hold+bd.sell+bd.strong_sell||1;
    const p = n=>(n/t*100).toFixed(1)+'%';
    h += `<div class="analyst-bar"><div class="ab-seg ab-strong-buy" style="width:${p(bd.strong_buy)}"></div><div class="ab-seg ab-buy" style="width:${p(bd.buy)}"></div><div class="ab-seg ab-hold" style="width:${p(bd.hold)}"></div><div class="ab-seg ab-sell" style="width:${p(bd.sell)}"></div><div class="ab-seg ab-strong-sell" style="width:${p(bd.strong_sell)}"></div></div>
    <div class="analyst-legend">
      <div class="al-item"><div class="al-dot" style="background:#16a34a"></div>Strong Buy ${bd.strong_buy}</div>
      <div class="al-item"><div class="al-dot" style="background:#22c55e"></div>Buy ${bd.buy}</div>
      <div class="al-item"><div class="al-dot" style="background:#f59e0b"></div>Hold ${bd.hold}</div>
      <div class="al-item"><div class="al-dot" style="background:#ef4444"></div>Sell ${bd.sell}</div>
      <div class="al-item"><div class="al-dot" style="background:#b91c1c"></div>Strong Sell ${bd.strong_sell}</div>
    </div>`;
  }
  return h + '</div>';
}

function fundamentalsSection(d) {
  const items = [
    [tip('Beta','beta'),                d.beta!=null?d.beta.toFixed(2):null],
    [tip('Fwd P/E','fwdpe'),            d.forward_pe!=null?d.forward_pe.toFixed(1):null],
    [tip('P/Book','pb'),                d.price_to_book!=null?d.price_to_book.toFixed(2):null],
    [tip('Div Yield','divyield'),       d.dividend_yield!=null?(d.dividend_yield*100).toFixed(2)+'%':null],
    [tip('Rev Growth','revgrowth'),     d.revenue_growth!=null?pct(d.revenue_growth):null],
    [tip('EPS Growth','epsgrowth'),     d.earnings_growth!=null?pct(d.earnings_growth):null],
    [tip('ROE','roe'),                  d.roe!=null?pct(d.roe):null],
    [tip('D/E','de'),                   d.debt_to_equity!=null?d.debt_to_equity.toFixed(2):null],
    [tip('Short Ratio','shortratio'),   d.short_ratio!=null?d.short_ratio.toFixed(1)+'d':null],
  ].filter(([,v])=>v!=null);
  if (!items.length) return '';
  return `<div class="d-section"><div class="d-title">Fundamentals</div><div class="stat-grid">${items.map(([k,v])=>`<div class="stat-box"><div class="sk">${k}</div><div class="sv">${v}</div></div>`).join('')}</div></div>`;
}

function dividendSection(d) {
  if (!isPortfolioMode) return '';
  const pos = resolvePos(positionsMap[d.ticker]);
  const hasDiv = d.dividend_yield || d.annual_dividend || d.ex_dividend_date;
  if (!hasDiv) return '';

  const yoc = pos && pos.shares && pos.avg_cost && d.annual_dividend
    ? (d.annual_dividend / pos.avg_cost * 100).toFixed(2) + '%' : null;
  const projIncome = pos && pos.shares && d.annual_dividend
    ? fmtGBP(toGBP(d.ticker, pos.shares * d.annual_dividend)) : null;
  const exDiv = d.ex_dividend_date || null;
  const exDivDays = exDiv ? daysUntil(exDiv) : null;

  const items = [
    [tip('Div Yield','divyield'),       d.dividend_yield ? (d.dividend_yield*100).toFixed(2)+'%' : null],
    ['Annual Div/Share',                d.annual_dividend ? fmt(d.annual_dividend) : null],
    [tip('Yield on Cost','yoc'),        yoc],
    ['Proj. Income/yr',                 projIncome],
    [tip('Ex-Div Date','exdiv'),        exDiv ? `${exDiv}${exDivDays != null ? ` (${exDivDays >= 0 ? 'in ' + exDivDays + 'd' : exDivDays + 'd ago'})` : ''}` : null],
  ].filter(([,v]) => v != null);

  if (!items.length) return '';
  return `<div class="d-section"><div class="d-title">Dividend Tracker</div><div class="stat-grid">${items.map(([k,v])=>`<div class="stat-box"><div class="sk">${k}</div><div class="sv">${v}</div></div>`).join('')}</div></div>`;
}

function transactionSection(d) {
  if (!isPortfolioMode) return '';
  const pos = positionsMap[d.ticker];
  if (!pos || !pos.transactions || !pos.transactions.length) return '';

  const avco = computeAVCO(pos.transactions);
  const rows = [...pos.transactions]
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .map(tx => {
      const total = tx.shares * tx.price;
      return `<div class="tx-row">
        <span class="tx-type ${tx.type}">${tx.type.toUpperCase()}</span>
        <span>${tx.shares.toLocaleString()} shares @ ${tx.price.toFixed(2)}</span>
        <span style="color:var(--muted)">${fmtMoney(total)}</span>
        <span class="tx-date">${tx.date}</span>
      </div>`;
    }).join('');

  return `<div class="d-section"><div class="d-title">Transaction History &middot; ${tip('AVCO','avco')}: ${avco.avg_cost.toFixed(2)}</div>
    <div class="tx-list">${rows}</div></div>`;
}

function rebalancingSection(d) {
  if (!isPortfolioMode) return '';
  const pos = resolvePos(positionsMap[d.ticker]);
  if (!pos || pos.target_weight_pct == null) return '';

  let totalValueGBP = 0;
  allData.forEach(dd => {
    const pp = resolvePos(positionsMap[dd.ticker]);
    if (pp && pp.shares && dd.price) {
      const v = toGBP(dd.ticker, pp.shares * dd.price);
      if (v != null) totalValueGBP += v;
    }
  });
  if (!totalValueGBP) return '';

  const curValue = pos.shares > 0 && d.price ? (toGBP(d.ticker, pos.shares * d.price) || 0) : 0;
  const currentPct = curValue / totalValueGBP * 100;
  const targetPct  = pos.target_weight_pct;
  const diff = targetPct - currentPct;
  const diffGBP = diff / 100 * totalValueGBP;
  const barMax = Math.max(targetPct, currentPct) * 1.1 || 1;
  const barColor = Math.abs(diff) < 0.5 ? 'var(--green)' : diff > 0 ? 'var(--yellow)' : 'var(--red)';
  const suggestion = Math.abs(diff) < 0.5
    ? '<span class="g">On target</span>'
    : diff > 0
      ? `<span class="g">Buy ~${fmtGBP(diffGBP)} to reach target</span>`
      : `<span class="r">Sell ~${fmtGBP(Math.abs(diffGBP))} to reach target</span>`;

  return `<div class="d-section"><div class="d-title">${tip('Rebalancing','rebalancing')}</div>
    <div class="rebal-row">
      <div class="rebal-labels">
        <span>Current ${currentPct.toFixed(1)}%</span>
        <span>Target <span style="color:var(--accent)">${targetPct}%</span></span>
      </div>
      <div class="rebal-track" style="margin:6px 0">
        <div class="rebal-current" style="width:${(currentPct/barMax*100).toFixed(1)}%;background:${barColor}"></div>
        <div class="rebal-target-line" style="left:${(targetPct/barMax*100).toFixed(1)}%"></div>
      </div>
      <div class="rebal-suggestion">${suggestion}</div>
    </div></div>`;
}

function newsSection(d) {
  if (!d.news?.length) return '';
  const items = d.news.map(n => {
    let ms; const ts = n.time;
    if (/^\d+$/.test(ts)) ms = parseInt(ts)*1000; else ms = Date.parse(ts);
    const diff = (Date.now()-ms)/1000;
    const rel = isNaN(ms)?'':diff<3600?Math.round(diff/60)+'m ago':diff<86400?Math.round(diff/3600)+'h ago':Math.round(diff/86400)+'d ago';
    const title = n.link?`<a href="${n.link}" target="_blank" rel="noopener">${n.title}</a>`:n.title;
    return `<div class="news-item"><div class="news-title">${title}</div><div class="news-meta">${[n.publisher,rel].filter(Boolean).join(' &middot; ')}</div></div>`;
  }).join('');
  return `<div class="d-section"><div class="d-title">Recent News</div><div class="news-list">${items}</div></div>`;
}

function renderCards() {
  const f = allData.filter(d => {
    if (filter === 'all')       return true;
    if (filter === 'buy')       return d.recommendation === 'BUY';
    if (filter === 'hold')      return d.recommendation === 'HOLD';
    if (filter === 'sell')      return d.recommendation === 'SELL';
    if (filter === 'equity')    return d.type === 'equity';
    if (filter === 'etf')       return d.type === 'etf' || d.type === 'etc';
    if (filter === 'changed')   return d.previous_recommendation && d.previous_recommendation !== d.recommendation;
    if (filter === 'watchlist') return watchlistTickers.includes(d.ticker);
    return true;
  });

  const el = document.getElementById('cards');
  if (!f.length) {
    const msg = filter === 'changed'   ? 'No signal changes since last run.'
              : filter === 'watchlist' ? 'Your watchlist is empty. Add tickers to the watchlist array in positions.json.'
              : 'No holdings match this filter.';
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">${msg}</div>`;
    return;
  }

  el.innerHTML = f.map((d, i) => { try {
    const rec   = d.recommendation.toLowerCase();
    const sigs  = (d.reasons || []).map(r => `<li>${r}</li>`).join('');
    const delta    = deltaChip(d.recommendation, d.previous_recommendation);
    const verified = d.stooq_verified ? '<span class="verified-chip">&#10003; Stooq</span>' : '';

    // Earnings badge
    const earningsDays = daysUntil(d.earnings_date);
    const earningsBadge = earningsDays != null && earningsDays >= 0 && earningsDays <= 14
      ? `<span class="earnings-chip">&#128197; Earnings in ${earningsDays}d</span>` : '';

    return `<div class="card ${rec}" id="c${i}" onclick="toggle(${i})">
      <div class="card-top">
        <div>
          <div class="card-ticker">${d.ticker} <span class="chevron">&#9660;</span></div>
          <div class="card-name">${d.name}</div>
          <div class="card-sector">${d.sector} &middot; ${d.type.toUpperCase()}</div>
          <div class="badge ${rec}">${d.recommendation}</div>${delta}${verified}${earningsBadge}
        </div>
        <div class="card-right">
          <div class="card-price">${d.price != null ? (d.price < 100 ? d.price.toFixed(2) : d.price.toFixed(1)) : '&mdash;'}</div>
          <div class="card-day ${pcC(d.day_change_pct)}">${pc(d.day_change_pct)}</div>
        </div>
      </div>
      ${positionStrip(d)}
      <div class="metrics">
        <div class="metric"><div class="m-label">Week</div><div class="m-val ${pcC(d.week_change_pct)}">${pc(d.week_change_pct)}</div></div>
        <div class="metric"><div class="m-label">Month</div><div class="m-val ${pcC(d.month_change_pct)}">${pc(d.month_change_pct)}</div></div>
        <div class="metric"><div class="m-label">${tip('vs 52W High','52whigh')}</div><div class="m-val ${pcC(d.pct_from_52w_high != null ? d.pct_from_52w_high*100 : null)}">${pc(d.pct_from_52w_high != null ? d.pct_from_52w_high*100 : null)}</div></div>
        <div class="metric"><div class="m-label">${tip('RSI','rsi')}</div><div class="m-val">${d.rsi != null ? d.rsi.toFixed(0) : '&mdash;'}</div></div>
      </div>
      <div class="detail" id="d${i}">
        <div class="d-section"><div class="d-title">${tip('Technical Signals','blended')}</div><ul class="signals">${sigs}</ul></div>
        <div class="d-section"><div class="d-title">Key Levels</div><div class="stat-grid">
          <div class="stat-box"><div class="sk">${tip('SMA 50','sma50')}</div><div class="sv">${fmt(d.sma_50)}</div></div>
          <div class="stat-box"><div class="sk">${tip('SMA 200','sma200')}</div><div class="sv">${fmt(d.sma_200)}</div></div>
          <div class="stat-box"><div class="sk">52W High</div><div class="sv">${fmt(d.high_52w)}</div></div>
          <div class="stat-box"><div class="sk">52W Low</div><div class="sv">${fmt(d.low_52w)}</div></div>
          ${d.stooq_price ? `<div class="stat-box"><div class="sk">${tip('Stooq Price','stooq')}</div><div class="sv">${d.stooq_price.toFixed(2)}</div></div>` : ''}
          ${d.earnings_date ? `<div class="stat-box"><div class="sk">Next Earnings</div><div class="sv">${d.earnings_date}${earningsDays != null && earningsDays >= 0 ? ' ('+earningsDays+'d)' : ''}</div></div>` : ''}
        </div></div>
        ${dividendSection(d)}
        ${rebalancingSection(d)}
        ${transactionSection(d)}
        ${analystSection(d)}
        ${fundamentalsSection(d)}
        ${newsSection(d)}
        <div class="d-section"><div class="d-title">Fund Manager View</div><div class="commentary">${d.commentary}</div></div>
      </div>
    </div>`;
  } catch(e) { return `<div class="error-banner" style="margin:0">&#9888; ${d.ticker}: render error — ${e.message}</div>`; }
  }).join('');
}

function toggle(i) {
  document.getElementById('c'+i).classList.toggle('open');
  document.getElementById('d'+i).classList.toggle('open');
}
function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

// ── CSV export ────────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = [['Ticker','Name','Sector','Type','Recommendation','Price','Shares','Avg Cost','Value (GBP)','Cost (GBP)','P&L (GBP)','P&L%','Weight%']];
  let totalValueGBP = 0;
  const resolved = allData.map(d => {
    const pos = resolvePos(positionsMap[d.ticker]);
    if (!pos || !pos.shares || !d.price) return null;
    const v = toGBP(d.ticker, pos.shares * d.price);
    if (v != null) totalValueGBP += v;
    return { d, pos, v };
  }).filter(Boolean);

  resolved.forEach(({ d, pos, v }) => {
    const c = toGBP(d.ticker, pos.shares * pos.avg_cost);
    const pnl = v != null && c != null ? v - c : null;
    const pnlPct = c && pnl != null ? pnl / c * 100 : null;
    const wt = totalValueGBP && v != null ? v / totalValueGBP * 100 : null;
    rows.push([
      d.ticker, d.name, d.sector, d.type, d.recommendation,
      d.price?.toFixed(4) ?? '',
      pos.shares, pos.avg_cost?.toFixed(4) ?? '',
      v?.toFixed(2) ?? '',
      c?.toFixed(2) ?? '',
      pnl?.toFixed(2) ?? '',
      pnlPct?.toFixed(2) ?? '',
      wt?.toFixed(2) ?? '',
    ]);
  });

  // All holdings (even without positions)
  allData.forEach(d => {
    if (resolved.find(r => r.d.ticker === d.ticker)) return;
    rows.push([d.ticker, d.name, d.sector, d.type, d.recommendation, d.price?.toFixed(4) ?? '', '', '', '', '', '', '', '']);
  });

  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `portfolio-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Auto-restore session ──────────────────────────────────────────────────────
async function tryRestoreSession() {
  const pwd = sessionStorage.getItem('ptpwd');
  if (!pwd || !allData.length) return;
  try {
    const res = await fetch('positions.enc?v=' + Date.now());
    if (!res.ok) return;
    const enc = await res.json();
    const data = await decryptPositions(pwd, enc);
    applyPortfolioData(data, null);
  } catch(e) {
    sessionStorage.removeItem('ptpwd');
  }
}

// ── Main load ─────────────────────────────────────────────────────────────────
async function load() {
  try {
    const res = await fetch('data.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    allData = payload.holdings || [];
    document.getElementById('overlay').style.display = 'none';
    if (!allData.length) throw new Error('No holdings in data');

    renderMacro(payload.macro || {});
    renderSummary();
    renderCards();

    const d = new Date(payload.generated);
    document.getElementById('dot').className = 'dot live';
    document.getElementById('status-txt').textContent =
      'Data from ' + d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'}) +
      ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' UTC';

    if (payload.sources?.length) {
      document.getElementById('sources-footer').innerHTML =
        `<div class="sources-footer"><strong>Data sources:</strong><br>${payload.sources.map(s => `&bull; ${s}`).join('<br>')}</div>`;
    }

    await tryRestoreSession();
  } catch(e) {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('cards').innerHTML =
      `<div class="error-banner">&#9888;&#65039; Could not load data.json &mdash; ${e.message}<br><br>The data file is generated daily by GitHub Actions. Check back after the workflow completes.</div>`;
    document.getElementById('dot').className = 'dot error';
    document.getElementById('status-txt').textContent = 'Data unavailable';
  }
}

load();
</script>
